<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140">
  <!-- Shield -->
  <path d="M50,8 L90,8 Q102,8 102,22 L102,62 Q102,88 78,98 L52,108 L26,98 Q2,88 2,62 L2,22 Q2,8 14,8 Z" fill="#2d7a3a"/>
  <!-- Shield crease line -->
  <line x1="52" y1="18" x2="52" y2="102" stroke="#1a4d24" stroke-width="2" stroke-linecap="round"/>

  <!-- Bug/Tick silhouette inside shield -->
  <g fill="none" stroke="#5fce73" stroke-width="3.5" stroke-linecap="round">
    <!-- Head -->
    <circle cx="52" cy="38" r="6" fill="#5fce73" stroke="none"/>
    <!-- Body (oval) -->
    <ellipse cx="52" cy="62" rx="12" ry="18" fill="#5fce73" stroke="none"/>
    <!-- Left legs -->
    <line x1="40" y1="50" x2="28" y2="42"/>
    <line x1="40" y1="58" x2="26" y2="56"/>
    <line x1="40" y1="66" x2="26" y2="70"/>
    <line x1="42" y1="74" x2="30" y2="82"/>
    <!-- Right legs -->
    <line x1="64" y1="50" x2="76" y2="42"/>
    <line x1="64" y1="58" x2="78" y2="56"/>
    <line x1="64" y1="66" x2="78" y2="70"/>
    <line x1="62" y1="74" x2="74" y2="82"/>
  </g>

  <!-- "Pest 'Em" wordmark -->
  <text x="130" y="82" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="72" fill="#0f2d14" letter-spacing="-1">Pest &#x2019;Em</text>

  <!-- "WE GET 'EM ALL" tagline -->
  <text x="133" y="112" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="22" fill="#2d7a3a" letter-spacing="3">WE GET &#x2019;EM ALL</text>
</svg>
