<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Pest 'Em</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Urbanist',sans-serif;background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{text-align:center;padding:60px 40px;max-width:480px;}
.checkmark{width:72px;height:72px;margin:0 auto 24px;background:#e6f7e9;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.checkmark svg{width:36px;height:36px;stroke:#2a7a3a;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
h1{font-size:32px;font-weight:800;color:#0e2d14;margin-bottom:12px;}
p{font-size:17px;color:#555;line-height:1.7;margin-bottom:28px;}
a.back{display:inline-block;font-size:15px;font-weight:700;color:#2a7a3a;border:2px solid #2a7a3a;padding:12px 28px;border-radius:8px;transition:all 0.2s;}
a.back:hover{background:#2a7a3a;color:#fff;}
a{text-decoration:none;color:inherit;}
</style>
</head>
<body>
<div class="card">
  <div class="checkmark">
    <svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg>
  </div>
  <h1>Thank You!</h1>
  <p>We'll be in touch within a few hours.<br>Call us anytime at <a href="tel:8887744290" style="color:#2a7a3a;font-weight:700;">(888) 774-4290</a>.</p>
  <a href="/" class="back">Back to Homepage</a>
</div>
</body>
</html>
