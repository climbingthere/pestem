<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pest 'Em Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@900;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 60px; font-family: 'Urbanist', sans-serif; }
.logo-wrap { padding: 60px 80px; background: #fff; }
.logo-wrap-dark { padding: 60px 80px; background: #0f2d14; }
label { font-size: 13px; color: #999; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; display: block; text-align: center; }
</style>
</head>
<body>

<!-- LIGHT VERSION -->
<div>
<label>Light Background</label>
<div class="logo-wrap">
<svg viewBox="0 0 720 210" width="720" height="210" xmlns="http://www.w3.org/2000/svg">

  <!-- TICK BUG ICON (replaces the P) -->
  <!-- Body - oval -->
  <ellipse cx="76" cy="108" rx="36" ry="46" fill="#5fce73"/>
  <!-- Head -->
  <circle cx="76" cy="64" r="20" fill="#5fce73"/>
  <!-- Eyes -->
  <circle cx="69" cy="62" r="4.5" fill="#0f2d14"/>
  <circle cx="83" cy="62" r="4.5" fill="#0f2d14"/>
  <!-- Mouth parts / palps (tick-style, no antennae) -->
  <line x1="70" y1="46" x2="62" y2="30" stroke="#5fce73" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="82" y1="46" x2="90" y2="30" stroke="#5fce73" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="76" y1="45" x2="76" y2="28" stroke="#5fce73" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 8 Legs (tick = arachnid) -->
  <!-- Left side -->
  <line x1="40" y1="84"  x2="6"  y2="66"  stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="40" y1="102" x2="4"  y2="100" stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="40" y1="120" x2="6"  y2="138" stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="46" y1="146" x2="22" y2="168" stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right side -->
  <line x1="112" y1="84"  x2="146" y2="66"  stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="112" y1="102" x2="148" y2="100" stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="112" y1="120" x2="146" y2="138" stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="106" y1="146" x2="130" y2="168" stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>

  <!-- "est 'Em" — the P is the bug above -->
  <text
    x="158" y="148"
    font-family="'Urbanist', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="108"
    fill="#0f2d14"
    dominant-baseline="auto">est &#x2018;Em</text>

  <!-- Tagline -->
  <text
    x="160" y="192"
    font-family="'Urbanist', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="34"
    fill="#2d4a2e"
    letter-spacing="9"
    dominant-baseline="auto">PEST CONTROL</text>

</svg>
</div>
</div>

<!-- DARK VERSION -->
<div>
<label>Dark Background</label>
<div class="logo-wrap-dark">
<svg viewBox="0 0 720 210" width="720" height="210" xmlns="http://www.w3.org/2000/svg">

  <!-- TICK BUG ICON -->
  <ellipse cx="76" cy="108" rx="36" ry="46" fill="#5fce73"/>
  <circle cx="76" cy="64" r="20" fill="#5fce73"/>
  <circle cx="69" cy="62" r="4.5" fill="#0f2d14"/>
  <circle cx="83" cy="62" r="4.5" fill="#0f2d14"/>
  <line x1="70" y1="46" x2="62" y2="30" stroke="#5fce73" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="82" y1="46" x2="90" y2="30" stroke="#5fce73" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="76" y1="45" x2="76" y2="28" stroke="#5fce73" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="40"  y1="84"  x2="6"   y2="66"  stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="40"  y1="102" x2="4"   y2="100" stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="40"  y1="120" x2="6"   y2="138" stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="46"  y1="146" x2="22"  y2="168" stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="112" y1="84"  x2="146" y2="66"  stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="112" y1="102" x2="148" y2="100" stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="112" y1="120" x2="146" y2="138" stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="106" y1="146" x2="130" y2="168" stroke="#5fce73" stroke-width="4.5" stroke-linecap="round"/>

  <text
    x="158" y="148"
    font-family="'Urbanist', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="108"
    fill="#ffffff"
    dominant-baseline="auto">est &#x2018;Em</text>

  <text
    x="160" y="192"
    font-family="'Urbanist', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="34"
    fill="#5fce73"
    letter-spacing="9"
    dominant-baseline="auto">PEST CONTROL</text>

</svg>
</div>
</div>

</body>
</html>
